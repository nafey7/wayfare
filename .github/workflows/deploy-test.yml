name: Deploy to Test

on:
  push:
    branches: [deploy/test]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Skip CI checks and deploy directly'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: myvoya-test-fastapi-react
  ECS_CLUSTER: test-cluster
  ECS_SERVICE: test-fastapi-react-service
  CONTAINER_NAME: fastapi-react-container

# NOTE: Terraform is applied manually, not via CI/CD.
# The GitHubActionsDeployRole only has ECR/ECS permissions.
# For infrastructure changes, run terraform locally with voya-admin profile.

jobs:
  # Build and push Docker image
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication
      contents: read

    outputs:
      image_tag: ${{ steps.image_info.outputs.image_tag }}
      image_uri: ${{ steps.image_info.outputs.image_uri }}
      commit_sha: ${{ steps.image_info.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::155304839180:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine Image Tag
        id: image_info
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_TAG="${COMMIT_SHA::8}"
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "Using image tag: $IMAGE_TAG"

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image_info.outputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Build image with commit hash for /health endpoint
          docker build \
            -f Dockerfile.test \
            --build-arg COMMIT_HASH=$COMMIT_SHA \
            --build-arg VITE_ENV=test \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.REACT_APP_GOOGLE_CLIENT_ID_STAGING }} \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY_STAGING }} \
            --build-arg VITE_GOOGLE_MAPS_MAP_ID=${{ secrets.VITE_GOOGLE_MAPS_MAP_ID_STAGING }} \
            --build-arg VITE_STRAPI_URL=${{ secrets.VITE_STRAPI_URL_STAGING }} \
            --build-arg VITE_STRAPI_API_TOKEN=${{ secrets.VITE_STRAPI_API_TOKEN_STAGING }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          # Push both tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Commit hash: $COMMIT_SHA"

  # Deploy to ECS
  deploy:
    name: Deploy to ECS Test
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::155304839180:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Current Task Definition
        id: download-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition test-fastapi-react \
            --query taskDefinition > task-definition.json

          echo "Downloaded current task definition"

      - name: Update Task Definition with New Image
        id: update-task-def
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
          CONTAINER: ${{ env.CONTAINER_NAME }}
        run: |
          # Update image in task definition (use named lookup to support sidecars)
          cat task-definition.json | \
            jq --arg IMAGE "$IMAGE_URI" --arg CONTAINER "$CONTAINER" \
              '.containerDefinitions |= map(if .name == $CONTAINER then . + {image: $IMAGE} else . end)' | \
            jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > new-task-definition.json

          echo "Updated task definition with image: $IMAGE_URI"

      - name: Register New Task Definition
        id: register-task-def
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered new task definition: $TASK_DEF_ARN"

      - name: Update ECS Service
        id: deploy-service
        env:
          TASK_DEF_ARN: ${{ steps.register-task-def.outputs.task_definition_arn }}
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition $TASK_DEF_ARN \
            --force-new-deployment

          echo "Service update initiated"

      - name: Wait for Service Stability
        run: |
          echo "Waiting for service to stabilize (max 10 minutes)..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

          echo "Deployment completed successfully!"

      - name: Get Service Status
        if: always()
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Status:status,RunningCount:runningCount,DesiredCount:desiredCount,Deployments:deployments[].{Status:status,TaskDefinition:taskDefinition}}'

  # Verify deployment
  verify:
    name: Verify Deployment
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Wait for service to be ready
        run: sleep 30

      - name: Check Health Endpoint
        env:
          COMMIT_SHA: ${{ needs.build-and-push.outputs.commit_sha }}
        run: |
          echo "Checking health endpoint..."
          HEALTH=$(curl -sf https://test.myvoya.ai/health || echo '{"error": "failed"}')
          echo "Health response: $HEALTH"

          # Verify commit hash in response
          DEPLOYED_COMMIT=$(echo $HEALTH | jq -r '.commit // "unknown"')
          EXPECTED_COMMIT="${COMMIT_SHA}"

          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Deployed commit: $DEPLOYED_COMMIT"

          if [ "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT" ]; then
            echo "✅ Commit hash verified!"
          else
            echo "⚠️ Commit hash mismatch (may need more time to propagate)"
          fi

  # Notify deployment status
  notify:
    name: Deployment Notification
    needs: [build-and-push, deploy, verify]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Deployment Summary
        env:
          COMMIT_SHA: ${{ needs.build-and-push.outputs.commit_sha }}
        run: |
          echo "## Test Environment Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Status:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Verify Status:** ${{ needs.verify.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${COMMIT_SHA::8}" >> $GITHUB_STEP_SUMMARY
          echo "**Full SHA:** $COMMIT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Image:** ${{ needs.build-and-push.outputs.image_uri }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test URL:** https://test.myvoya.ai" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** https://test.myvoya.ai/health" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** ${{ env.ECS_CLUSTER }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ env.ECS_SERVICE }}" >> $GITHUB_STEP_SUMMARY
