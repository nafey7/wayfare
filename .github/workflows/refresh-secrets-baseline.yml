name: Refresh Secrets Baseline

# Auto-regenerate .secrets.baseline on main so PRs never need to carry
# line-number-only changes that cause merge conflicts.
#
# Uses GITHUB_TOKEN which does NOT trigger other workflows, so this
# won't cause spurious CI or deploy runs.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.secrets.baseline'

jobs:
  refresh-baseline:
    name: Refresh detect-secrets baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Update baseline line numbers
        run: |
          detect-secrets scan --baseline .secrets.baseline > .secrets.baseline.new
          mv .secrets.baseline.new .secrets.baseline

      - name: Commit if changed
        run: |
          if git diff --quiet .secrets.baseline; then
            echo "Baseline already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .secrets.baseline
            git commit -m "chore: auto-refresh detect-secrets baseline"
            git push
          fi
