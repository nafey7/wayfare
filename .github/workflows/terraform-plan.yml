name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_ROLE_ARN: arn:aws:iam::155304839180:role/GitHubActionsTerraformRole

jobs:
  detect-changes:
    name: Detect Changed Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          MODULES_CHANGED="false"
          if echo "$CHANGED" | grep -q "^terraform/modules/"; then
            MODULES_CHANGED="true"
          fi

          ENV_LIST=()
          for env in test staging prod; do
            if [ "$MODULES_CHANGED" = "true" ] || echo "$CHANGED" | grep -q "^terraform/environments/${env}/"; then
              ENV_LIST+=("\"${env}\"")
            fi
          done

          if [ ${#ENV_LIST[@]} -gt 0 ]; then
            ENVS="[$(IFS=,; echo "${ENV_LIST[*]}")]"
          else
            ENVS="[]"
          fi

          echo "environments=$ENVS" >> $GITHUB_OUTPUT
          echo "Planning environments: $ENVS"

  plan:
    name: Plan (${{ matrix.environment }})
    needs: detect-changes
    if: needs.detect-changes.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.environments) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.7"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          EXTRA_ARGS=""
          # Staging has a committed tfvars
          if [ -f staging.tfvars ]; then
            EXTRA_ARGS="$EXTRA_ARGS -var-file=staging.tfvars"
          fi
          # All environments have ci.tfvars
          if [ -f ci.tfvars ]; then
            EXTRA_ARGS="$EXTRA_ARGS -var-file=ci.tfvars"
          fi
          # Prod needs imgproxy secrets
          if [ "${{ matrix.environment }}" = "prod" ]; then
            EXTRA_ARGS="$EXTRA_ARGS -var=imgproxy_key=${{ secrets.IMGPROXY_KEY }} -var=imgproxy_salt=${{ secrets.IMGPROXY_SALT }}"
          fi

          terraform plan -no-color -input=false $EXTRA_ARGS 2>&1 | tee /tmp/plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            // Truncate for GitHub comment limit
            if (output.length > 60000) {
              output = output.substring(0, 60000) + '\n... (truncated)';
            }
            const body = `### Terraform Plan: \`${{ matrix.environment }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Plan Status
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1
