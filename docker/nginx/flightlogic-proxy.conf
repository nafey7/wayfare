# FlightLogic Reverse Proxy Configuration
# Forwards all requests to FlightLogic API with detailed logging

log_format flightlogic_detailed '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'upstream_addr=$upstream_addr '
                                'upstream_status=$upstream_status '
                                'request_time=$request_time '
                                'upstream_response_time=$upstream_response_time '
                                'upstream_connect_time=$upstream_connect_time';

server {
    listen 8080;
    server_name _;

    # Enhanced logging
    access_log /var/log/nginx/flightlogic_access.log flightlogic_detailed;
    error_log /var/log/nginx/flightlogic_error.log debug;

    # Increase buffer sizes for large API responses
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 10M;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host travelnext.works;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "98.89.125.207";  # Whitelisted NAT gateway IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding gzip;

    # Timeouts for FlightLogic (can be slow)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Forward all requests to FlightLogic
    location / {
        proxy_pass https://travelnext.works;

        # Log request body (for debugging)
        proxy_set_body $request_body;

        # Handle errors
        proxy_intercept_errors off;
        proxy_redirect off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "FlightLogic Proxy OK\n";
        add_header Content-Type text/plain;
    }
}
