# Voya Development Environment
#
# Complete development stack with all services:
# - MongoDB database
# - Mongo Express (database management UI)
# - n8n (workflow automation)
# - Frontend Vite (React with hot reload)
# - Backend (FastAPI with auto-reload)
# - MailHog (email testing)
# - FlightLogic Mock Server (API testing)
# - Strapi CMS (develop mode with Content-Type Builder)
# - PostgreSQL for Strapi
# - ngrok (webhook tunneling for Stripe)
#
# Usage:
#   docker compose -f compose.dev.yaml up -d
#
#   Or use convenience file:
#   docker compose up -d  # Uses compose.yaml
#
# Service URLs:
#   Frontend Vite:    http://localhost:3002
#   Backend API:      http://localhost:8000/api
#   API Docs:         http://localhost:8000/api/docs
#   MongoDB:          localhost:27017
#   Mongo Express:    http://localhost:8081
#   n8n:              http://localhost:5678
#   MailHog:          http://localhost:8025
#   Mock FlightLogic: http://localhost:8002
#   imgproxy:         http://localhost:8010
#   Strapi CMS:       http://localhost:1337/admin
#   Strapi Postgres:  localhost:5433
#   ngrok Dashboard:  http://localhost:4040 (get public URL for webhooks)

services:
  # MongoDB Database (Development)
  mongodb:
    image: mongo:${MONGO_VERSION:-7.0}
    container_name: voya-dev-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${DATABASE_NAME:-voya_dev}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - voya-dev-mongodb-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=database"

  # MongoDB Express for database management (Development)
  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_VERSION:-1.0.0}
    container_name: voya-dev-mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH=${MONGO_EXPRESS_BASICAUTH:-false}
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-pass}
    depends_on:
      - mongodb
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=database-management"

  # n8n Workflow Automation for Itinerary Agent (Development)
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: voya-dev-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Basic Configuration
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=development

      # Webhook URL (critical for local development)
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}

      # Timezone
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}

      # Execution Settings (save all executions for debugging)
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=false

      # Database Connection (use same MongoDB)
      - DB_TYPE=mongodb
      - DB_MONGODB_CONNECTION_URL=mongodb://mongodb:27017/n8n_${DATABASE_NAME:-voya_dev}

      # Security: Encryption key for credentials
      # IMPORTANT: Generate random 32-char string in production
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-voya-dev-encryption-key-32chars}

      # External Services (will be set via n8n UI)
      # These are just placeholders - configure in n8n credentials UI
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY:-}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-}
    volumes:
      # Persist workflows, credentials, and execution data
      - voya-dev-n8n-data:/home/node/.n8n
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - voya-dev-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:5678/healthz || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "voya.environment=development"
      - "voya.service=workflow-automation"

  # React Frontend Vite (Development)
  frontend-vite:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    container_name: voya-dev-frontend-vite
    restart: unless-stopped
    ports:
      - "${FRONTEND_VITE_PORT:-3002}:3002"
    env_file:
      - path: ./frontend-v2/.env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - VITE_ENV=${ENVIRONMENT:-development}
      # Vite dev-server proxy target for `/api` and `/imgproxy` (Docker service name).
      - BACKEND_PROXY_TARGET=${BACKEND_PROXY_TARGET:-http://backend:80}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3002",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - voya-dev-network
    volumes:
      - ./frontend-v2:/app
      - voya-dev-frontend-vite-node-modules:/app/node_modules
    labels:
      - "voya.environment=development"
      - "voya.service=frontend-vite"

  # Python Backend (Development)
  backend:
    build:
      context: ./backend_python
      dockerfile: Dockerfile
      args:
        USE_POETRY: ${USE_POETRY:-false}
    container_name: voya-dev-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:80"
    environment:
      # Database
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017}
      - DATABASE_NAME=${DATABASE_NAME:-voya_dev}
      # Application
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-please-change-in-production-minimum-32-chars}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      # Email (MailHog for development)
      - USE_MAILHOG=${USE_MAILHOG:-true}
      - MAILHOG_HOST=${MAILHOG_HOST:-mailhog}
      - MAILHOG_PORT=${MAILHOG_PORT:-1025}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-noreply@example.com}
      # Google OAuth
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8001/api/auth/google/authenticate}
      # Google AI (multiple variable names for compatibility)
      - GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      # Payment Provider Selection
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-stripe}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Stripe Payment Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_USE_CONNECT_TRANSFERS=${STRIPE_USE_CONNECT_TRANSFERS:-true}
      # Revolut Payment Configuration
      - REVOLUT_API_BASE_URL=${REVOLUT_API_BASE_URL:-}
      - REVOLUT_API_KEY=${REVOLUT_API_KEY:-}
      - REVOLUT_PUBLIC_KEY=${REVOLUT_PUBLIC_KEY:-}
      - REVOLUT_WEBHOOK_SECRET=${REVOLUT_WEBHOOK_SECRET:-}
      - REVOLUT_MERCHANT_ID=${REVOLUT_MERCHANT_ID:-}
      # Feature Flags
      - VOYA_FEATURE_FLAG_USE_LANGGRAPH_FLIGHTS=${VOYA_FEATURE_FLAG_USE_LANGGRAPH_FLIGHTS:-false}
      - VOYA_FEATURE_FLAG_USE_LANGGRAPH_HOTELS=${VOYA_FEATURE_FLAG_USE_LANGGRAPH_HOTELS:-false}
      - VOYA_FEATURE_FLAG_USE_LANGGRAPH_ITINERARY=${VOYA_FEATURE_FLAG_USE_LANGGRAPH_ITINERARY:-true}
      - VOYA_FEATURE_FLAG_USE_FLIGHTLOGIC_AIRPORTS=${VOYA_FEATURE_FLAG_USE_FLIGHTLOGIC_AIRPORTS:-false}
      # Langfuse Observability
      # NOTE: default is intentionally ``false`` for dev. Flipping this to
      # ``true`` while the dev shell has prod LANGFUSE_PUBLIC_KEY /
      # LANGFUSE_SECRET_KEY set would silently ship local LLM turns to the
      # production Langfuse project under the ``production`` prompt label.
      # Individual devs opt in via ``.env.local`` after pointing keys at a
      # dev / staging Langfuse project (or overriding LANGFUSE_BASE_URL +
      # the prompt label accordingly).
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      - LANGFUSE_PROMPT_LABEL=${LANGFUSE_PROMPT_LABEL:-production}
      # FlightLogic Mock API (default for development)
      # NOTE: These are set explicitly to ensure mock server is used by default
      # To use real FlightLogic API: Set these in shell before docker compose up
      #   FLIGHTLOGIC_FLIGHTS_API_BASE_URL=https://... docker compose up -d
      - FLIGHTLOGIC_API_URL=${FLIGHTLOGIC_API_URL:-http://flightlogic-mock:8002/api/aeroVE5}
      # IMPORTANT: Client prefers FLIGHTLOGIC_FLIGHTS_API_BASE_URL over deprecated FLIGHTLOGIC_API_URL
      - FLIGHTLOGIC_FLIGHTS_API_BASE_URL=${FLIGHTLOGIC_FLIGHTS_API_BASE_URL:-http://flightlogic-mock:8002/api/aeroVE5}
      - FLIGHTLOGIC_HOTELS_API_BASE_URL=${FLIGHTLOGIC_HOTELS_API_BASE_URL:-http://flightlogic-mock:8002/api/hotel-api-v6}
      - FLIGHTLOGIC_ACCESS_TYPE=${FLIGHTLOGIC_ACCESS_TYPE:-Test}
      - FLIGHTLOGIC_API_KEY=${FLIGHTLOGIC_API_KEY:-}
      - FLIGHTLOGIC_USER_ID=${FLIGHTLOGIC_USER_ID:-mock_user}
      - FLIGHTLOGIC_PASSWORD=${FLIGHTLOGIC_PASSWORD:-mock_password}
      - FLIGHTLOGIC_IP_ADDRESS=${FLIGHTLOGIC_IP_ADDRESS:-}
      - FLIGHTLOGIC_SPOOF_IP=${FLIGHTLOGIC_SPOOF_IP:-}
      # imgproxy Configuration
      - IMGPROXY_ENABLED=${IMGPROXY_ENABLED:-true}
      - IMGPROXY_URL=${IMGPROXY_URL:-http://imgproxy:8080}
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      # S3 (MinIO locally) for user profile photos.
      # No AWS key env vars: boto3 reads creds from the mounted shared-credentials
      # file (AWS_SHARED_CREDENTIALS_FILE). In cloud the ECS task role is used and
      # no file/env is set.
      - S3_PHOTOS_BUCKET=${S3_PHOTOS_BUCKET:-myvoya-local-photos}
      - S3_PHOTOS_REGION=${S3_PHOTOS_REGION:-us-east-1}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/mock-minio-credentials
    env_file:
      # Backend-specific environment variables (optional)
      # ⚠️  WARNING: Variables set above in 'environment' take precedence over this file
      # If you want to override FLIGHTLOGIC_API_URL, either:
      #   1. Comment it out from 'environment' section above, OR
      #   2. Set it as shell variable: FLIGHTLOGIC_API_URL=... docker compose up -d
      - path: ./backend_python/.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:80/health').read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      mongodb:
        condition: service_healthy
      flightlogic-mock:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - voya-dev-network
    volumes:
      - ./backend_python:/app
      - ./frontend-v2/dist:/app/static
      # Local-only AWS shared-credentials file (MinIO). Cloud uses ECS task role.
      - ./docker/mock-minio-credentials:/run/secrets/mock-minio-credentials:ro
    labels:
      - "voya.environment=development"
      - "voya.service=backend"

  # MailHog for local email testing
  mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION:-v1.0.1}
    platform: linux/amd64
    container_name: voya-dev-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_WEB_PORT:-8025}:8025" # Web UI only (SMTP 1025 internal only)
    environment:
      - MH_STORAGE=${MAILHOG_STORAGE:-memory}
      - MH_HOSTNAME=${MAILHOG_HOSTNAME:-mailhog}
    networks:
      - voya-dev-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8025",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "voya.environment=development"
      - "voya.service=email-testing"

  # FlightLogic Mock API Server
  flightlogic-mock:
    build:
      context: ./backend_python
      dockerfile: tests/mocks/flightlogic/Dockerfile
    container_name: voya-dev-flightlogic-mock
    restart: unless-stopped
    ports:
      - "${FLIGHTLOGIC_MOCK_PORT:-8002}:8002"
    environment:
      - ENVIRONMENT=development
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=mock-api"

  # ngrok for webhook testing (exposes backend to internet for Stripe webhooks)
  ngrok:
    image: ngrok/ngrok:latest
    container_name: voya-dev-ngrok
    restart: unless-stopped
    ports:
      - "4040:4040" # ngrok web dashboard
    environment:
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN:-} # Optional: set for persistent URLs and longer sessions
    command:
      - "http"
      - "backend:80"
      - "--authtoken=${NGROK_AUTH_TOKEN:-}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=webhook-tunnel"

  # FlightLogic API Inspector (nginx)
  # NOTE: This won't work locally due to IP whitelist, but structure is ready for ECS deployment
  flightlogic-inspector:
    image: nginx:alpine
    container_name: voya-dev-flightlogic-inspector
    volumes:
      - ./docker/nginx/flightlogic-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FLIGHTLOGIC_INSPECTOR_PORT:-8003}:8080" # Proxy port
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=api-proxy"
    # NOTE: Local use won't work - your IP isn't whitelisted by FlightLogic
    # To use: Deploy to ECS where IP is whitelisted, then point FLIGHTLOGIC_API_URL to ECS inspector
    # View logs: docker compose logs -f flightlogic-inspector

  # PostgreSQL for Strapi CMS (Development)
  strapi-db:
    image: postgres:${STRAPI_POSTGRES_VERSION:-16-alpine}
    container_name: voya-dev-strapi-db
    restart: unless-stopped
    ports:
      - "${STRAPI_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${STRAPI_DB_NAME:-strapi}
      - POSTGRES_USER=${STRAPI_DB_USER:-strapi_admin}
      - POSTGRES_PASSWORD=${STRAPI_DB_PASSWORD:-strapi_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STRAPI_DB_USER:-strapi_admin} -d ${STRAPI_DB_NAME:-strapi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - voya-dev-strapi-db-data:/var/lib/postgresql/data
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=strapi-database"

  # Strapi CMS (Development - runs in develop mode for Content-Type Builder)
  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
      target: dev
    container_name: voya-dev-strapi
    restart: unless-stopped
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - APP_URL=http://localhost:${STRAPI_PORT:-1337}
      - NODE_ENV=development
      # Database (Postgres sidecar)
      - DATABASE_HOST=strapi-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${STRAPI_DB_NAME:-strapi}
      - DATABASE_USERNAME=${STRAPI_DB_USER:-strapi_admin}
      - DATABASE_PASSWORD=${STRAPI_DB_PASSWORD:-strapi_dev_password}
      - DATABASE_SSL=false
      # Secrets (generate with: openssl rand -base64 32)
      - APP_KEYS=${STRAPI_APP_KEYS:-dev-key-1,dev-key-2}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT:-dev-api-token-salt-change-me}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET:-dev-admin-jwt-secret-change-me}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT:-dev-transfer-token-salt}
      - JWT_SECRET=${STRAPI_JWT_SECRET:-dev-strapi-jwt-secret-change-me}
    depends_on:
      strapi-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1337/_health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - voya-dev-network
    volumes:
      - ./cms:/app
      - voya-dev-strapi-node-modules:/app/node_modules
    labels:
      - "voya.environment=development"
      - "voya.service=strapi-cms"

  # imgproxy - High-performance image processing server
  # Replaces in-app image proxy (app/api/proxy.py) for better performance and security
  # See: https://docs.imgproxy.net/
  imgproxy:
    image: darthsim/imgproxy:latest
    container_name: voya-dev-imgproxy
    restart: unless-stopped
    ports:
      - "${IMGPROXY_PORT:-8010}:8080"
    environment:
      # Server configuration
      - IMGPROXY_BIND=:8080
      - IMGPROXY_NETWORK=tcp
      # Security: URL signing (generate keys with: openssl rand -hex 32)
      - IMGPROXY_KEY=${IMGPROXY_KEY:-}
      - IMGPROXY_SALT=${IMGPROXY_SALT:-}
      # Security: Allow insecure (unsigned) URLs in development only
      - IMGPROXY_ALLOW_INSECURE_URLS=${IMGPROXY_ALLOW_INSECURE_URLS:-true}
      # Security: Sanitize SVG to prevent XSS
      - IMGPROXY_SANITIZE_SVG=true
      # Performance: Concurrency settings
      - IMGPROXY_CONCURRENCY=${IMGPROXY_CONCURRENCY:-10}
      - IMGPROXY_MAX_SRC_RESOLUTION=${IMGPROXY_MAX_SRC_RESOLUTION:-50}
      # Caching: Enable ETag for browser caching
      - IMGPROXY_USE_ETAG=true
      # Allowed sources (restrict in production)
      - IMGPROXY_ALLOWED_SOURCES=${IMGPROXY_ALLOWED_SOURCES:-}
      # Timeout settings
      - IMGPROXY_READ_TIMEOUT=${IMGPROXY_READ_TIMEOUT:-10}
      - IMGPROXY_WRITE_TIMEOUT=${IMGPROXY_WRITE_TIMEOUT:-10}
      - IMGPROXY_DOWNLOAD_TIMEOUT=${IMGPROXY_DOWNLOAD_TIMEOUT:-10}
      # Format settings: Enable modern formats
      - IMGPROXY_ENABLE_WEBP_DETECTION=true
      - IMGPROXY_ENABLE_AVIF_DETECTION=true
      - IMGPROXY_PREFERRED_FORMATS=avif,webp,jpeg
      # S3 source support (MinIO locally; user profile photos).
      # No AWS key env vars: imgproxy reads MinIO creds from the AWS shared-credentials
      # file mounted at AWS_SHARED_CREDENTIALS_FILE. In cloud the ECS task role is used.
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=${IMGPROXY_S3_ENDPOINT:-http://minio:9000}
      - IMGPROXY_S3_REGION=${S3_PHOTOS_REGION:-us-east-1}
      - AWS_SHARED_CREDENTIALS_FILE=/run/secrets/mock-minio-credentials
    volumes:
      - ./docker/mock-minio-credentials:/run/secrets/mock-minio-credentials:ro
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=image-proxy"

  # MinIO: local S3 backend for user profile photos.
  # Mirrors the mailhog pattern — single-purpose container, isolated volume,
  # web console for inspection. No real AWS credentials are ever used.
  minio:
    image: minio/minio:latest
    container_name: voya-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-voya-local}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-voya-local-secret}
    volumes:
      - voya-dev-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - voya-dev-network
    labels:
      - "voya.environment=development"
      - "voya.service=object-storage"

  # One-shot: create the photos bucket. Idempotent.
  minio-init:
    image: minio/mc:latest
    container_name: voya-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-voya-local} ${MINIO_ROOT_PASSWORD:-voya-local-secret} &&
      mc mb --ignore-existing local/${S3_PHOTOS_BUCKET:-myvoya-local-photos} &&
      mc anonymous set none local/${S3_PHOTOS_BUCKET:-myvoya-local-photos} &&
      echo 'MinIO bucket ready: ${S3_PHOTOS_BUCKET:-myvoya-local-photos}'
      "
    restart: "no"
